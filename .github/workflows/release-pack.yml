name: Release extension pack

# Separate from release.yml's v*.*.* tags -- this packages and publishes
# extension-pack/, the metadata-only "install both" pack, on its own tag
# prefix so the two release cycles never collide.
on:
  push:
    tags: ["pack-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. pack-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension-pack/package-lock.json
      - run: npm ci
      - name: Package vsix
        run: npx vsce package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: extension-pack/*.vsix
      - name: Publish to VS Code Marketplace
        # Same VSCE_PAT secret as release.yml -- both publish under
        # "taciugraskan". Until it's set, this step fails and the GitHub
        # Release above -- with the vsix already attached -- still succeeds.
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }}
