name: Release extension pack

# Separate from release.yml's v*.*.* tags -- this packages and publishes
# extension-pack/, the metadata-only "install both" pack, on its own tag
# prefix so the two release cycles never collide.
on:
  push:
    tags: ["pack-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. pack-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension-pack/package-lock.json
      - run: npm ci
      - name: Package vsix
        run: npx vsce package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: extension-pack/*.vsix
      - name: Keep the vsix for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension-pack/*.vsix
          if-no-files-found: error

  publish:
    # Trusted Publishing, as in release.yml: it needs its own policy on the
    # "PbsandtDev" publisher naming this workflow file (release-pack.yml).
    # Only this job can request an OIDC token. If it fails, the GitHub Release
    # above -- with the vsix attached -- is already made.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath *.vsix
