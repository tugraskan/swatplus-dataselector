name: Release

# Publish the standalone MCP server, the enriched schemas, and the vsix as
# release assets so downstream consumers (e.g. the SWAT+ Assistant) can pin a
# version and download the files instead of building from source.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (extension + MCP server bundles)
        run: npm run package
      - name: Package vsix
        run: npm run package:vsix
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp dist/mcp-server.js release-assets/
          cp resources/schema/swatplus-schema-enriched.json release-assets/
          cp resources/schema/swatplus-output-schema.json release-assets/
          cp resources/schema/swatplus-generated-schema.json release-assets/
          cp swat-dataset-selector-*.vsix release-assets/ || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/mcp-server.js
            release-assets/swatplus-schema-enriched.json
            release-assets/swatplus-output-schema.json
            release-assets/swatplus-generated-schema.json
            release-assets/*.vsix
      - name: Keep the vsix for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: release-assets/*.vsix
          if-no-files-found: error

  publish:
    # Publishes with the VSCE_PAT secret: an Azure DevOps token scoped to one
    # organization, with Marketplace (Manage) scope, made by the account that
    # owns the "PbsandtDev" publisher. It lasts at most a year; when it
    # expires, make a new one and set it with `gh secret set VSCE_PAT`.
    # (Trusted Publishing was tried, but the Marketplace refused the token
    # exchange for this publisher.)
    # It is its own job so that npm ci and the build above never see the
    # token. If it fails, the GitHub Release above -- with the vsix attached
    # -- is already made.
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to VS Code Marketplace
        # The vsix attached to the release, not a rebuild. vsce reads the
        # token from VSCE_PAT.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath *.vsix
